<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Secure K8s Delivery Path</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #172033;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(720px, calc(100vw - 48px));
        padding: 40px;
        border: 1px solid #d9e0ea;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 45px rgba(23, 32, 51, 0.08);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(32px, 5vw, 52px);
        line-height: 1;
        letter-spacing: 0;
      }
      p {
        margin: 0;
        font-size: 18px;
        line-height: 1.6;
        color: #435066;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #005f73;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>simple-web</h1>
      <p>
        This workload is the local smoke target for the
        <code>secure-k8s-delivery-path</code> golden path.
      </p>
    </main>
  </body>
</html>
